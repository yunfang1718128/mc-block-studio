[package]
name = "mc-block-studio"
version = "0.4.1"
description = "把图片或原版方块转成 Minecraft 像素画，3D 预览并导出 .litematic。"
authors = ["yunfang1718128"]
license = "GPL-2.0-only"
repository = "https://github.com/yunfang1718128/mc-block-studio"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
